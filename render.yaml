services:
  - type: web
    name: retypo-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon # or frankfurt, ohio, singapore
    plan: starter # Works on Free or Starter tier
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
